[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mark-six-model-validation"
version = "0.1.0"
description = "Exact subset probabilities and chronological validation of sparse draw models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "scipy>=1.13,<2"]

[project.optional-dependencies]
test = ["pytest>=7,<9"]
plots = ["matplotlib>=3.7,<4"]

[project.scripts]
marksix = "marksix.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
